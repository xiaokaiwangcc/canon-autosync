name: 构建桌面应用

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: canon-autosync-macos
          - os: windows-latest
            artifact: canon-autosync-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: npm ci && npm run build
        working-directory: frontend

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r desktop/requirements.txt

      - name: 生成应用图标（ico/icns）
        run: python desktop/make_icons.py

      - name: PyInstaller 打包
        run: pyinstaller desktop/CanonAutoSync.spec --noconfirm

      - name: 打包分发文件
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/CanonAutoSync.app "${{ matrix.artifact }}.zip"
          else
            powershell -Command "Compress-Archive -Path dist/CanonAutoSync -DestinationPath '${{ matrix.artifact }}.zip'"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
