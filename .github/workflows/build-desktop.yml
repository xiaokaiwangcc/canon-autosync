name: 构建桌面应用

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 裁剪编译最小化 ffmpeg（仅视频首帧提取所需能力），替代 imageio-ffmpeg 的完整二进制以缩小包体积
  build-ffmpeg-win:
    name: 编译精简 ffmpeg (Windows)
    runs-on: ubuntu-latest
    steps:
      - name: 安装 mingw-w64 交叉编译工具链
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm

      - name: 下载 ffmpeg 源码
        run: |
          curl -fsSL -o ffmpeg.tar.gz https://ffmpeg.org/releases/ffmpeg-8.1.tar.gz
          tar xzf ffmpeg.tar.gz

      - name: 配置裁剪编译（仅 mp4/mov 解封装 + H.264/HEVC 解码 + JPEG 输出）
        working-directory: ffmpeg-8.1
        run: |
          ./configure --target-os=mingw32 --arch=x86_64 --cross-prefix=x86_64-w64-mingw32- \
            --enable-cross-compile --disable-everything \
            --enable-decoder=h264,hevc,mpeg4,aac,mp3 --enable-demuxer=mov \
            --enable-parser=h264,hevc,mpeg4video,aac,mpegaudio \
            --enable-encoder=mjpeg --enable-muxer=image2,image2pipe \
            --enable-protocol=file,pipe --enable-filter=scale --enable-swscale \
            --enable-small --disable-ffplay --disable-ffprobe --disable-doc \
            --disable-debug --disable-network --disable-avdevice \
            --disable-swresample --disable-autodetect --disable-iconv --disable-zlib \
            --disable-bzlib --disable-lzma --disable-schannel --disable-sdl2

      - name: 编译
        working-directory: ffmpeg-8.1
        run: make -j$(nproc)

      - name: 上传 ffmpeg.exe
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-8.1/ffmpeg.exe

  build:
    name: ${{ matrix.os }}
    needs: build-ffmpeg-win
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: canon-autosync-macos
          - os: windows-latest
            artifact: canon-autosync-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: npm ci && npm run build
        working-directory: frontend

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          pip install -r desktop/requirements.txt

      - name: 生成应用图标（ico/icns）
        run: python desktop/make_icons.py

      - name: 下载精简 ffmpeg（Windows）
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: desktop/ffmpeg

      - name: 写入版本号（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/APP_VERSION = os.environ.get(\"APP_VERSION\", \".*\")/APP_VERSION = os.environ.get(\"APP_VERSION\", \"$VER\")/" backend/app/config.py
          rm -f backend/app/config.py.bak
          grep APP_VERSION backend/app/config.py | head -1

      - name: PyInstaller 打包
        run: pyinstaller desktop/CanonAutoSync.spec --noconfirm

      - name: 打包分发文件
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/CanonAutoSync.app "${{ matrix.artifact }}.zip"
            hdiutil create -volname "Canon AutoSync" -srcfolder dist/CanonAutoSync.app -ov -format UDZO "${{ matrix.artifact }}.dmg"
          else
            cp dist/CanonAutoSync.exe "${{ matrix.artifact }}.exe"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

      - name: 发布到 GitHub Release（仅 tag 构建）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 等待 fpk 工作流创建 Release（最长 15 分钟），超时则自行创建
          for i in $(seq 1 60); do
            gh release view "$TAG_NAME" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release create "$TAG_NAME" --title "canon-autosync $TAG_NAME" --generate-notes 2>/dev/null || true
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release upload "$TAG_NAME" "${{ matrix.artifact }}.dmg" "${{ matrix.artifact }}.zip" --clobber
          else
            gh release upload "$TAG_NAME" "${{ matrix.artifact }}.exe" --clobber
          fi
